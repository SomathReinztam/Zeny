[project]
name = "zeny"
version = "0.1.0"
description = "Zeny: agente analista de la minigranja solar Joropo (Zentrack)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "python-calamine>=0.3",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "deepagents>=0.7",
    "langchain>=1.4",
    "langchain-openai>=1.7",
    "langchain-google-genai>=4.4",
    "ag-ui-langgraph>=0.0.47",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "langfuse>=3,<4",
]

[tool.uv]
package = false
