[instrucciones_agente.seguidores_solares]
regla_analisis = """

Mapea las identificaciones de hardware de 6 caracteres (extraídas de las direcciones MAC, como EFF378) con su respectivo 'Tracker X'.

Cruza la información del archivo de posición (reporte_posicion_.xlsx) con el de parámetros eléctricos (brain_electrics_.xlsx) para detectar picos atípicos de corriente durante el movimiento de los motores.

Si el ángulo real de un seguidor se desvía más de 2.0° con respecto al ángulo objetivo en horas de sol, reporta una falla de seguimiento.
"""

# ==============================================================================

# 4. ESTACIÓN METEOROLÓGICA

# ==============================================================================

[equipos.estacion_meteorologica]
cantidad = 1
nombre = "Estación Meteorológica Central Joropo"
archivo_origen = "reporte_clima2026-09-01-2026-09-30.xlsx"

[equipos.estacion_meteorologica.sensores]
anemometro_velocidad = { tipo = "Anemómetro", unidad = "m/s", umbral_alerta_viento_fuerte = 15.0 }
anemometro_direccion = { tipo = "Veleta", unidad = "grados" }
pluviometro = { tipo = "Pluviómetro", unidad = "mm" }
piranometro_ghi = { tipo = "Piranómetro GHI (Global Horizontal)", unidad = "W/m²" }
piranometro_poa = { tipo = "Piranómetro POA (Plane of Array)", unidad = "W/m²" }
temperatura_ambiente = { tipo = "Sensor Temperatura Ambiente", unidad = "°C" }
temperatura_panel = { tipo = "Sensor Temperatura de Módulo (Back-of-module)", unidad = "°C", coeficiente_perdida_pct_c = 0.35, umbral_efecto_termico_c = 60.0 }
sensor_soiling = { tipo = "Sensor de Soiling / Suciedad", unidad = "%", umbral_lavado_critico_pct = 5.0 }

[instrucciones_agente.estacion_meteorologica]
reglas_analisis = """

PR Y RENDIMIENTO: Utiliza la irradiancia POA (Plane of Array) de reporte_clima_*.xlsx como la referencia principal de energía incidente para evaluar el desempeño fotovoltaico.

SUCIEDAD / SOILING: Si las pérdidas por suciedad del sensor de soiling superan el 5.0%, genera automáticamente una sugerencia para programar lavado de paneles.

EFECTO TÉRMICO: Considera las pérdidas por temperatura de panel en horas pico si la temperatura del módulo supera los 60 °C.

PROTECCIÓN POR VIENTO: Si la velocidad del viento supera los 15 m/s, comprueba la activación del modo de defensa en los seguidores solares (posición horizontal de 0.0°).

AUTO-LIMPIEZA: Correlaciona los eventos de lluvia registrados por el pluviómetro con reducciones naturales del porcentaje de suciedad (soiling).
"""